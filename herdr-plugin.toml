id = "community.quota-sidebar"

name = "Quota Sidebar"

version = "0.2.0"

min_herdr_version = "0.7.0"

description = "Show the weekly Claude and Codex subscription quota in the Herdr tab bar"

platforms = ["linux", "macos"]

[[build]]

command = ["bun", "install", "--frozen-lockfile"]

[[actions]]

id = "refresh"

title = "Refresh quota now"

contexts = ["workspace", "global"]

command = ["bun", "run", "src/main.ts", "refresh"]

[[actions]]

id = "show"

title = "Show quota snapshot"

contexts = ["workspace", "global"]

command = ["bun", "run", "src/main.ts", "show"]

[[keys.command]]

key = "prefix+shift+q"

type = "plugin_action"

command = "community.quota-sidebar.show"

description = "quota snapshot"
